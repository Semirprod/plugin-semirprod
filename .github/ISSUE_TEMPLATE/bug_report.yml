name: Bug report
description: The plugin does not behave as expected.
labels: [bug]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.2.4"
    validations:
      required: true
  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      placeholder: "32.0.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: OBS log
      description: >-
        Lines containing [semirprod-studio] from Help > Log Files.
        Remove tokens and stream keys first.
      render: text
